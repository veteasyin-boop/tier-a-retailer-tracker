name: Growta API checks

on:
  push:
    branches:
      - growta-one/phase-1-tenant-rbac
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check API
        run: npm run build

      - name: Run API unit tests
        run: npm test
