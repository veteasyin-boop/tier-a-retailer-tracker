name: Supabase database tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - growta-one/phase-1-tenant-rbac
      - growta-one/phase-2-dynamic-organogram
  pull_request:
    branches:
      - main
      - growta-one/phase-2-dynamic-organogram

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        id: setup_cli
        uses: supabase/setup-cli@v1
        with:
          version: v3.1.0

      - name: Start local Supabase
        run: supabase start

      - name: Run database and RLS tests
        run: supabase test db

      - name: Validate read-only tenant access inventory SQL
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/diagnostics/tenant-rls-access-inventory.sql

      - name: Set up Node.js for API integration check
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: services/api
        run: npm install --no-audit --no-fund

      - name: Verify audit keyset filter against local PostgREST
        working-directory: services/api
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:postgrest

      - name: Stop local Supabase
        if: always() && steps.setup_cli.outcome == 'success'
        run: supabase stop --no-backup
